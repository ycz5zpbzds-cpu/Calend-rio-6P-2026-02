name: Calendar stability hotfix

on:
  push:
    paths:
      - '.github/workflows/stability-hotfix.yml'

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply MED070 integration
        run: python3 .github/scripts/integrate_med070.py

      - name: Validate site
        run: |
          python3 -m json.tool eventos.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'MED070_FIXED_EVENTS' in html
          assert 'Conferências de Ética e Bioética' in Path('eventos.json').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('/tmp/calendar.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/calendar.js

      - name: Commit updated site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html eventos.json
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Adiciona MED070 A3 com avaliações e detalhes'
          git push

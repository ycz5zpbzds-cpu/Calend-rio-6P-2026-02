<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#111827">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link id="appManifest" rel="manifest" href="./manifest.webmanifest?v=26">
  <link id="appFavicon" rel="icon" href="./icon.svg?v=26" type="image/svg+xml">
  <link id="appleTouchIcon" rel="apple-touch-icon" href="./icon.svg?v=26">
  <title>Calendário Medicina UFMG — 6º Período — 2026/2</title>
  <style>
:root{
  --bg:#f4f2ec;--panel:#ffffff;--panel-2:#faf9f6;--ink:#15171b;--muted:#6b7280;
  --line:#dedbd3;--soft:#ece9e2;--accent:#111827;--accent-ink:#ffffff;
  --good:#059669;--warn:#d97706;--danger:#dc2626;--shadow:0 12px 34px rgba(15,23,42,.09);
  --radius:20px;
  --chart-completed:#10b981;
  --chart-pending:#f59e0b;
  --progress-start:#7c3aed;
  --progress-end:#dc2626;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px),var(--bg);
  background-size:30px 30px;
}
body.dark{
  --bg:#0f1114;--panel:#181b20;--panel-2:#20242a;--ink:#f8fafc;--muted:#a7afba;
  --line:#30353d;--soft:#252a31;--accent:#f8fafc;--accent-ink:#111827;--shadow:none;
}
button,input,select{font:inherit}
button{color:inherit}
.boot{padding:52px;text-align:center;color:var(--muted)}
.shell{max-width:1540px;margin:auto;padding:16px}
.sticky{position:static;z-index:auto;padding-bottom:10px;background:transparent;backdrop-filter:none}
.hero{
  position:relative;overflow:hidden;display:grid;grid-template-columns:1.25fr .75fr;gap:18px;
  padding:25px 29px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)
}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(#7c3aed 0 16%,#059669 16% 32%,#ea580c 32% 48%,#dc2626 48% 64%,#2563eb 64% 80%,#db2777 80%)}
.eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{margin:10px 0 7px;font-size:35px;line-height:1.04;letter-spacing:-.025em}
.sub{color:var(--muted)}
.countdown{display:flex;gap:18px;align-items:center;padding:20px;border-radius:17px;background:#111827;color:#fff}
.cd-num{font-size:48px;font-weight:950;line-height:.95}
.cd-unit{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#cbd5e1;margin-top:5px}
.cd-title{font-weight:850}.cd-meta{font-size:13px;color:#cbd5e1;margin-top:5px}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
.ctrl{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:11px 13px}
.search{flex:1 1 260px}.btn{font-weight:760;cursor:pointer}.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav{display:flex;gap:8px;overflow:auto;padding-bottom:3px}
.nav button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 13px;font-weight:760;cursor:pointer}
.nav button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.view{display:none}.view.active{display:block}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card{padding:16px}.metric{font-size:30px;font-weight:950}.label{color:var(--muted);font-size:13px}
.progress{padding:16px;margin-bottom:16px}.progress-head{display:flex;justify-content:space-between;margin-bottom:8px}
.track{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--progress-start),var(--progress-end))}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.legend button{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 11px;font-weight:760;cursor:pointer}
.legend button.off{opacity:.34}.dot{width:10px;height:10px;border-radius:50%}
.grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.panel{padding:18px}.panel h2{margin:0 0 14px}
.timeline{display:grid;gap:10px}.trow{display:grid;grid-template-columns:90px 14px 1fr;gap:12px;align-items:start}
.tdate{font:800 12px ui-monospace;color:var(--muted)}.tdot{width:12px;height:12px;border-radius:50%;margin-top:5px}
.tcard{position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:13px 42px 13px 13px}
.tcard b{display:block}.tcard small{color:var(--muted)}.fav,.done{position:absolute;top:9px;border:0;background:transparent;cursor:pointer;font-size:18px}.fav{right:8px}.done{right:33px}
.tcard.completed{opacity:.55}.tcard.completed b{text-decoration:line-through}
.quick-list{display:grid;gap:10px}.quick{border-left:5px solid var(--c);background:var(--panel-2);padding:12px;border-radius:12px}.quick b{display:block}.quick small{color:var(--muted)}
.calendar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.month{overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:17px}
.mhead{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:900}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;padding:8px;font:700 10px ui-monospace;color:var(--muted)}
.day{min-height:59px;padding:7px 3px;text-align:center;border-radius:9px;cursor:pointer}.day:hover{background:var(--soft)}.day.today{outline:2px solid var(--ink)}.day.range{background:color-mix(in srgb,#059669 11%,transparent)}
.num{font-weight:850}.marks{display:flex;justify-content:center;gap:3px;flex-wrap:wrap;margin-top:7px}.mark{width:7px;height:7px;border-radius:50%}
.mlist{padding:12px;border-top:1px dashed var(--line)}.mrow{display:grid;grid-template-columns:auto 1fr;gap:8px;margin:9px 0}.chip{color:#fff;border-radius:5px;padding:3px 6px;font:800 10px ui-monospace}.mrow b{font-size:13px}.mrow small{color:var(--muted)}
.week-view{display:grid;grid-template-columns:72px repeat(7,1fr);border:1px solid var(--line);border-radius:16px;overflow:auto;background:var(--panel)}
.week-view>div{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px}.week-view .head{min-height:auto;font-weight:850;background:var(--panel-2)}
.week-event{font-size:11px;border-radius:8px;padding:6px;margin:4px 0;color:#fff}
.disc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.disc-card{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.disc-card h3{margin:0}.disc-count{font-size:32px;font-weight:950}.mini{color:var(--muted);font-size:13px;margin:6px 0}
.heavy{display:grid;gap:10px}.heavy-row{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:12px}.heat{font-weight:950;color:var(--danger)}
.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.setting{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px}.setting label{display:flex;justify-content:space-between;gap:10px;align-items:center}
.empty{color:var(--muted);font-style:italic}.footer{text-align:center;color:var(--muted);font-size:12px;margin:22px 0}
.drawer{position:fixed;inset:0;z-index:250;display:none}.drawer.show{display:block}.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.38)}.sheet{position:absolute;right:0;top:0;bottom:0;width:min(470px,92vw);background:var(--panel);padding:20px;overflow:auto;box-shadow:-16px 0 40px rgba(0,0,0,.18)}.sheet-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:var(--soft);border-radius:50%;width:36px;height:36px;cursor:pointer}.sheet .trow{grid-template-columns:70px 12px 1fr}
.toast{position:fixed;right:18px;bottom:18px;z-index:400;padding:12px 14px;border-radius:12px;background:#111827;color:#fff;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:1100px){.hero{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.calendar-grid{grid-template-columns:repeat(2,1fr)}.disc-grid{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
@media(max-width:700px){.shell{padding:9px}.sticky{position:static}.hero{padding:19px 17px}h1{font-size:27px}.countdown{align-items:flex-start}.cd-num{font-size:38px}.stats{grid-template-columns:repeat(2,1fr)}.calendar-grid,.disc-grid,.settings-grid{grid-template-columns:1fr}.panel{padding:13px}.day{min-height:52px}.trow{grid-template-columns:72px 12px 1fr}.btn{flex:1}.week-view{grid-template-columns:56px repeat(7,150px)}}


/* ===== V5: gráficos, status automático e próximos por disciplina ===== */
.stats .card{appearance:none;text-align:left;color:var(--ink)}
.status-legend{display:flex;gap:16px;flex-wrap:wrap;margin:4px 0 14px;color:var(--muted);font-size:12px}
.status-key{display:flex;align-items:center;gap:6px}.status-swatch{width:10px;height:10px;border-radius:3px}
.chart-grid{display:grid;grid-template-columns:.75fr 1.25fr;gap:16px;margin:16px 0}
.chart-panel{min-height:310px}
.donut-wrap{display:grid;place-items:center;padding:10px 0 2px}
.donut{
  width:210px;height:210px;border-radius:50%;display:grid;place-items:center;
  position:relative;box-shadow:inset 0 0 0 1px var(--line)
}
.donut:after{content:"";width:128px;height:128px;border-radius:50%;background:var(--panel);position:absolute}
.donut-center{position:relative;z-index:1;text-align:center}.donut-center strong{display:block;font-size:32px}.donut-center span{font-size:12px;color:var(--muted)}
.chart-list{display:grid;gap:13px}
.chart-row{display:grid;grid-template-columns:130px 1fr 72px;gap:10px;align-items:center}
.chart-name{font-weight:760;font-size:13px}
.stacked{height:18px;background:var(--soft);border-radius:999px;overflow:hidden;display:flex}
.seg-past{background:var(--chart-completed);height:100%}.seg-future{background:var(--chart-pending);height:100%}
.chart-values{text-align:right;font:750 11px ui-monospace;color:var(--muted)}
.discipline-chart{display:grid;gap:11px}
.discipline-chart .chart-row{grid-template-columns:150px 1fr 72px}
.next-disc-section{margin:16px 0}
.next-disc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.next-disc-card{
  border:1px solid var(--line);border-top:5px solid var(--c);background:var(--panel);
  color:var(--ink);border-radius:16px;padding:15px;text-align:left;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease
}
.next-disc-card:hover{transform:translateY(-2px);border-color:var(--c)}
.next-disc-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.next-disc-name{font-weight:850}.next-disc-days{font-size:22px;font-weight:950;white-space:nowrap}
.next-disc-unit{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right}
.next-disc-title{font-size:13px;margin-top:12px;font-weight:700}.next-disc-meta{font-size:12px;color:var(--muted);margin-top:5px}.next-disc-link{font-size:12px;font-weight:800;margin-top:12px;color:var(--c)}
.auto-note{font-size:12px;color:var(--muted);margin-top:9px}
.week-board{display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:10px;overflow:auto;padding-bottom:5px}
.week-column{border:1px solid var(--line);border-radius:15px;background:var(--panel);min-height:260px;padding:11px}
.week-column.today{outline:2px solid var(--ink)}
.week-column-head{font-weight:850;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.week-column-head small{display:block;color:var(--muted);font-weight:600;margin-top:3px}
.week-empty{color:var(--muted);font-size:12px;font-style:italic}
.week-event{cursor:pointer}
@media(max-width:1100px){
  .chart-grid{grid-template-columns:1fr}
  .next-disc-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
  .next-disc-grid{grid-template-columns:1fr}
  .chart-row,.discipline-chart .chart-row{grid-template-columns:105px 1fr 62px}
  .donut{width:190px;height:190px}
  .week-board{grid-template-columns:repeat(7,165px)}
}


/* =========================================================
   V6 MOBILE PREMIUM
   O celular recebe uma interface própria, mais compacta,
   com navegação inferior, cards legíveis e calendário maior.
   ========================================================= */

.mobile-only{display:none}
.mobile-month-toggle{display:none}

@media(max-width:700px){
  html{scroll-padding-top:8px}
  body{
    background-size:22px 22px;
    padding-bottom:88px;
    -webkit-text-size-adjust:100%;
  }
  .shell{padding:7px}
  .sticky{
    position:static;
    padding-bottom:2px;
    background:transparent;
    backdrop-filter:none;
  }

  /* Cabeçalho muito mais compacto */
  .hero{
    grid-template-columns:1fr;
    gap:10px;
    padding:15px 14px 14px 20px;
    border-radius:16px;
  }
  .hero:before{width:6px}
  .eyebrow{
    font-size:9px;
    letter-spacing:.11em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  h1{
    font-size:21px;
    line-height:1.08;
    margin:6px 0 2px;
    letter-spacing:-.02em;
  }
  .hero .sub{
    display:none;
  }

  /* Contagem regressiva horizontal e baixa */
  .countdown{
    min-height:70px;
    padding:11px 12px;
    border-radius:13px;
    gap:12px;
  }
  .cd-num{
    font-size:31px;
    min-width:57px;
    text-align:center;
  }
  .cd-unit{
    font-size:8px;
    letter-spacing:.09em;
    text-align:center;
  }
  .cd-title{
    font-size:13px;
    line-height:1.2;
  }
  .cd-meta{
    font-size:11px;
    margin-top:3px;
  }

  /* Busca sempre visível; filtros compactos */
  .controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin:8px 0 4px;
  }
  .ctrl{
    min-height:43px;
    padding:9px 10px;
    border-radius:11px;
    font-size:14px;
  }
  .search{
    grid-column:1/-1;
    width:100%;
    font-size:16px; /* evita zoom automático do Safari */
  }
  #type{grid-column:1/2}
  #theme{grid-column:2/3}
  #icsAll,#icsDisc{
    font-size:12px;
    min-height:39px;
  }

  /* Navegação fixa inferior, estilo aplicativo */
  .nav{
    position:fixed;
    left:8px;
    right:8px;
    bottom:8px;
    z-index:300;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:2px;
    padding:6px;
    border:1px solid var(--line);
    border-radius:18px;
    background:color-mix(in srgb,var(--panel) 94%,transparent);
    box-shadow:0 12px 35px rgba(15,23,42,.20);
    backdrop-filter:blur(18px);
    overflow:visible;
  }
  .nav button{
    min-width:0;
    min-height:53px;
    padding:5px 2px;
    border:0;
    border-radius:12px;
    background:transparent;
    font-size:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:2px;
  }
  .nav button::before{
    font-size:20px;
    line-height:1;
  }
  .nav button::after{
    font-size:8px;
    font-weight:800;
    line-height:1;
  }
  .nav button[data-view="dashboard"]::before{content:"⌂"}
  .nav button[data-view="dashboard"]::after{content:"Início"}
  .nav button[data-view="calendar"]::before{content:"▦"}
  .nav button[data-view="calendar"]::after{content:"Mês"}
  .nav button[data-view="week"]::before{content:"▤"}
  .nav button[data-view="week"]::after{content:"Semana"}
  .nav button[data-view="timeline"]::before{content:"≡"}
  .nav button[data-view="timeline"]::after{content:"Agenda"}
  .nav button[data-view="disciplines"]::before{content:"▥"}
  .nav button[data-view="disciplines"]::after{content:"Matérias"}
  .nav button[data-view="resources"]::before{content:"⌁"}
.nav button[data-view="resources"]::after{content:"Arquivos"}
.nav button[data-view="favorites"]::before{content:"☆"}
  .nav button[data-view="favorites"]::after{content:"Favoritos"}
  .nav button[data-view="settings"]::before{content:"⚙"}
  .nav button[data-view="settings"]::after{content:"Ajustes"}
  .nav button.active{
    background:var(--accent);
    color:var(--accent-ink);
  }

  /* Cards de resumo compactos, mas com números grandes */
  .stats{
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin:10px 0;
  }
  .stats .card{
    min-height:82px;
    padding:12px;
    border-radius:14px;
  }
  .metric{font-size:29px}
  .label{font-size:12px}

  .card,.panel{border-radius:15px}
  .panel{padding:13px}
  .panel h2{
    font-size:18px;
    margin-bottom:11px;
  }

  .progress{
    padding:12px;
    margin-bottom:10px;
  }
  .progress-head{font-size:13px}
  .track{height:8px}

  /* Legenda horizontal rolável */
  .legend{
    flex-wrap:nowrap;
    overflow-x:auto;
    padding:2px 1px 7px;
    margin:8px 0;
    scrollbar-width:none;
  }
  .legend::-webkit-scrollbar{display:none}
  .legend button{
    flex:0 0 auto;
    padding:7px 9px;
    font-size:12px;
  }

  /* Próximo evento por disciplina */
  .next-disc-section{margin:10px 0}
  .next-disc-section .panel{padding:12px}
  .next-disc-grid{
    grid-template-columns:1fr;
    gap:8px;
  }
  .next-disc-card{
    padding:12px;
    border-radius:14px;
  }
  .next-disc-days{font-size:21px}
  .next-disc-title{
    font-size:13px;
    margin-top:8px;
  }
  .next-disc-meta,.next-disc-link{font-size:11px}

  /* Gráficos em uma coluna e maiores */
  .chart-grid{
    grid-template-columns:1fr;
    gap:10px;
    margin:10px 0;
  }
  .chart-panel{min-height:auto}
  .donut{width:180px;height:180px}
  .donut:after{width:108px;height:108px}
  .donut-center strong{font-size:29px}
  .chart-list,.discipline-chart{gap:11px}
  .chart-row,.discipline-chart .chart-row{
    grid-template-columns:92px minmax(100px,1fr) 56px;
    gap:7px;
  }
  .chart-name{
    font-size:11px;
    line-height:1.15;
  }
  .stacked{height:16px}
  .chart-values{font-size:10px}

  /* Conteúdo vertical no celular */
  .grid-2{grid-template-columns:1fr;gap:10px}
  .quick{padding:10px}
  .heavy-row{
    grid-template-columns:70px 1fr 25px;
    padding:10px;
    font-size:12px;
  }

  /* Timeline e agenda mais legíveis */
  .trow{
    grid-template-columns:52px 9px 1fr;
    gap:7px;
  }
  .tdate{font-size:10px;padding-top:3px}
  .tdot{width:9px;height:9px}
  .tcard{
    padding:11px 37px 11px 11px;
    border-radius:12px;
  }
  .tcard b{
    font-size:13px;
    line-height:1.25;
  }
  .tcard small{
    font-size:11px;
    line-height:1.2;
  }
  .fav,.done{
    font-size:16px;
    top:7px;
  }
  .fav{right:5px}
  .done{right:28px}

  /* Calendário: uma coluna e dias maiores */
  .calendar-grid{
    grid-template-columns:1fr;
    gap:10px;
  }
  .month{border-radius:15px}
  .mhead{
    padding:13px 14px;
    font-size:16px;
  }
  .week div{
    padding:7px 2px;
    font-size:9px;
  }
  .day{
    min-height:52px;
    padding:6px 1px;
    border-radius:8px;
  }
  .num{font-size:14px}
  .marks{margin-top:6px;gap:2px}
  .mark{width:7px;height:7px}

  /* A lista extensa de cada mês fica recolhida no celular */
  .mobile-month-toggle{
    display:block;
    width:calc(100% - 20px);
    margin:0 10px 10px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--ink);
    border-radius:10px;

const DEFAULT_CHART_STYLES={
  completed:"#10b981",
  pending:"#f59e0b",
  progressStart:"#7c3aed",
  progressEnd:"#dc2626"
};

function loadChartStyles(){
  try{
    return {...DEFAULT_CHART_STYLES,...JSON.parse(localStorage.getItem(CHART_STYLE_KEY)||"{}")};
  }catch(_){
    return {...DEFAULT_CHART_STYLES};
  }
}

function applyChartStyles(){
  const styles=loadChartStyles();
  const root=document.documentElement.style;
  root.setProperty("--chart-completed",styles.completed);
  root.setProperty("--chart-pending",styles.pending);
  root.setProperty("--progress-start",styles.progressStart);
  root.setProperty("--progress-end",styles.progressEnd);
}

function saveChartStyle(name,value){
  const styles=loadChartStyles();
  styles[name]=value;
  localStorage.setItem(CHART_STYLE_KEY,JSON.stringify(styles));
  applyChartStyles();
}

function resetChartStyles(){
  localStorage.removeItem(CHART_STYLE_KEY);
  applyChartStyles();
}

function makeEventSourceKey(event,index){

    event.label||"",
    event.time||"",

function prepareEvents(events,useLocalEdits=true){

  return mergeFixedMed070Events(events).map((event,index)=>{

    item._sourceKey=makeEventSourceKey(item,index);
    item._source={
      date:item.date,
      end:item.end||"",
      label:item.label,
      time:item.time||""
    };

    if(edit){

      item.label=edit.label||item.label;
      item.time=edit.time||undefined;

    return item;
  }).sort((a,b)=>dateKey(a.date)-dateKey(b.date)||a.disc.localeCompare(b.disc));

function wait(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));

async function apiRequest(action,payload={}){
  const endpoint=S.data?.meta?.apiUrl;
  if(!endpoint)throw new Error("Endereço da API não configurado.");

  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),25000);

  try{
    const response=await fetch(endpoint,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action,...payload}),
      cache:"no-store",
      redirect:"follow",
      signal:controller.signal
    });

    if(!response.ok){
      throw new Error(`A API respondeu com erro ${response.status}.`);
    }

    const text=await response.text();
    let data;

    try{
      data=JSON.parse(text);
    }catch(_){
      throw new Error("A API respondeu em formato inesperado.");
    }

    if(!data.ok)throw new Error(data.error||"A operação não foi concluída.");
    return data;
  }catch(error){
    if(error?.name==="AbortError"){
      throw new Error("A conexão demorou mais que o esperado.");
    }
    if(error instanceof TypeError){
      throw new Error("Não foi possível alcançar a API agora.");
    }
    throw error;
  }finally{
    clearTimeout(timeout);
  }
}


function assertCurrentApiVersion(data){
  const version=String(data?.apiVersion||"");
  if(version!==REQUIRED_API_VERSION){
    throw new Error(`API desatualizada: está na versão ${version||"antiga"} e o site precisa da V${REQUIRED_API_VERSION}. Atualize a implantação do Apps Script.`);
  }
  return version;
}

function appendVersion(url,version){
  if(!url)return DEFAULT_APP_ICON;
  const separator=url.includes("?")?"&":"?";
  return `${url}${separator}v=${encodeURIComponent(version||Date.now())}`;
}

function ensureHeadLink(id,rel,href,type=""){
  let link=document.getElementById(id);

  if(!link){
    link=document.createElement("link");
    link.id=id;
    link.rel=rel;
    document.head.appendChild(link);
  }

  link.href=href;
  if(type)link.type=type;
  return link;
}

    const item=S.data.disciplines[code];
    const defaults=S.defaultDisciplineStyles[code]||{

    savedDisc[code]={color:item.color,icon:item.icon||""};

      config:data.config||{},
      configRevision:String(data.configRevision||""),
      apiVersion:String(data.apiVersion||"")
    }));
  }catch(_){}
}

function loadApiSnapshot(){
  try{
    const snapshot=JSON.parse(localStorage.getItem(API_SNAPSHOT_KEY)||"null");
    if(!snapshot||!Array.isArray(snapshot.events))return false;

    applyGlobalConfig(snapshot.config||{});
    S.data.events=prepareEvents(snapshot.events,false);
    S.sync={
      status:"ok",
      message:"Última cópia sincronizada",
      updatedAt:snapshot.savedAt?new Date(snapshot.savedAt):null,
      remoteCount:S.data.events.length
    };
    return true;
  }catch(_){
    return false;
  }
}

function eventDataSignature(events){
  return JSON.stringify((events||[]).map(e=>[
    e.id||"",e.date||"",e.end||"",e.disc||"",e.label||"",e.time||""
  ]));
}

async function bootstrapGlobal(silent=false){
  const previousSignature=eventDataSignature(S.data?.events||[]);
  const previousRevision=String(S.api?.configRevision||"");
  const hadConnection=S.api?.status==="ok";

  if(!silent){
    S.api={...S.api,status:"loading",message:"Sincronizando…"};
    renderSyncStatus();
  }

  let lastError=null;

  for(let attempt=1;attempt<=3;attempt++){
    try{
      const data=await apiRequest("bootstrap");
      const apiVersion=assertCurrentApiVersion(data);
      const nextEvents=prepareEvents(data.events||[],false);
      const nextSignature=eventDataSignature(nextEvents);
      const nextRevision=String(data.configRevision||"");
      const eventsChanged=nextSignature!==previousSignature;
      const configChanged=nextRevision!==previousRevision;
      const now=new Date();

      S.data.events=nextEvents;
      if(configChanged||!hadConnection)applyGlobalConfig(data.config||{});
      saveApiSnapshot(data);

      S.sync={status:"ok",message:"Sincronização global ativa",updatedAt:now,remoteCount:nextEvents.length};
      S.api={status:"ok",message:"Sincronização global ativa",updatedAt:now,version:apiVersion,configRevision:nextRevision};

      if(eventsChanged||configChanged||!hadConnection||!silent){
        render();
      }else{
        renderCountdown();
        renderSyncStatus();
      }

      if(!silent)toast("Dados sincronizados em todos os dispositivos.");
      return true;
    }catch(error){
      lastError=error;
      if(attempt<3)await wait(attempt*900);
    }
  }

  S.api={...S.api,status:"error",message:lastError?.message||"Não foi possível conectar agora."};
  S.sync={...S.sync,status:"error",message:"Mantendo a última cópia válida"};
  renderSyncStatus();
  if(!silent)toast(`${S.api.message} Mantive a última cópia disponível.`);
  return false;
}

async function refreshCurrentSource(silent=false){
  return bootstrapGlobal(silent);

function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result||""));
    reader.onerror=()=>reject(new Error("Não foi possível ler a imagem."));
    reader.readAsDataURL(file);
  });
}

function loadImageFromUrl(url){
  return new Promise((resolve,reject)=>{
    const image=new Image();
    image.onload=()=>resolve(image);
    image.onerror=()=>reject(new Error("Não foi possível abrir a imagem."));
    image.src=url;
  });
}

async function prepareAppIconFile(file){
  if(!file)throw new Error("Escolha uma imagem.");
  if(file.size>8*1024*1024)throw new Error("A imagem original deve ter no máximo 8 MB.");
  if(!/^image\/(png|jpeg|webp|svg\+xml)$/i.test(file.type)){
    throw new Error("Use PNG, JPG, WEBP ou SVG.");
  }

  const sourceUrl=await readFileAsDataUrl(file);
  const image=await loadImageFromUrl(sourceUrl);
  const canvas=document.createElement("canvas");
  const size=512;
  const padding=32;

  canvas.width=size;
  canvas.height=size;

  const context=canvas.getContext("2d");
  context.clearRect(0,0,size,size);
  context.imageSmoothingEnabled=true;
  context.imageSmoothingQuality="high";

  const available=size-padding*2;
  const scale=Math.min(available/image.naturalWidth,available/image.naturalHeight);
  const width=Math.max(1,Math.round(image.naturalWidth*scale));
  const height=Math.max(1,Math.round(image.naturalHeight*scale));
  const x=Math.round((size-width)/2);
  const y=Math.round((size-height)/2);

  context.drawImage(image,x,y,width,height);
  const dataUrl=canvas.toDataURL("image/png");

  if(dataUrl.length>2.7*1024*1024){
    throw new Error("A imagem ficou grande demais depois do processamento.");
  }

  return dataUrl;
}

      disc:event.disc,

function d(s){
  const [y,m,day]=String(s||"").split("-").map(Number);
  return new Date(Date.UTC(y,m-1,day,12,0,0));
}
function fmt(s){
  const parts=String(s||"").split("-");
  if(parts.length!==3)return String(s||"");
  return `${parts[2].padStart(2,"0")}/${parts[1].padStart(2,"0")}`;
}
function dateKey(s){const [y,m,day]=s.split("-").map(Number);return Date.UTC(y,m-1,day)}

function saoPauloTodayParts(){
  const parts=new Intl.DateTimeFormat("en-US",{
    timeZone:"America/Sao_Paulo",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  }).formatToParts(new Date());

  const values={};
  parts.forEach(part=>{
    if(part.type!=="literal")values[part.type]=Number(part.value);
  });
  return values;
}

function todayKey(){
  const p=saoPauloTodayParts();
  return Date.UTC(p.year,p.month-1,p.day);
}

function calendarDaysUntil(s){
  return (dateKey(s)-todayKey())/DAY_MS;
}

function endKey(e){return dateKey(e.end||e.date)}
function isPast(e){return endKey(e)<todayKey()}
function isCurrent(e){return dateKey(e.date)<=todayKey()&&endKey(e)>=todayKey()}
function end(e){return d(e.end||e.date)}
function id(e){return `${e.disc}|${e.date}|${e.label}`}
function disc(k){return S.data.disciplines[k]||{name:k,short:k,color:"#64748B",icon:"📚"}}

function isUnconfirmed(e){

}

function eventKind(e){

  const t=(e.label+" "+(e.time||"")).toLowerCase();
  if(/ambulatório|ambulatorial|triagem|consulta/.test(t))return"ambulatory";
  if(/\bgd\b|gd\d|gd\+/.test(t))return"gd";
  if(/prova|av1|av2|av3|av4|av6|modular|exame especial|atividade integradora|avaliativo|avaliação parcial|avaliação final|salto triplo|semana de provas/.test(t))return"assessment";
  return"class";

function classify(e){return isUnconfirmed(e)?"pending":eventKind(e)}

function days(e){

/*
  Extrai horários como:
  20h
  13h15
  14h–15h30
  10:30–11:30
*/
function parseEventClockTimes(value){
  const text=String(value||"");
  const regex=/(?:^|[^\d])([01]?\d|2[0-3])\s*(?:h|:)\s*(\d{2})?/gi;
  const result=[];
  let match;

  while((match=regex.exec(text))){
    result.push({
      hour:Number(match[1]),
      minute:Number(match[2]||0)
    });
  }

  return result;
}

function timeZoneOffsetMs(date,timeZone){
  const parts=new Intl.DateTimeFormat("en-US",{
    timeZone,
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hourCycle:"h23"
  }).formatToParts(date);

  const values={};
  parts.forEach(part=>{
    if(part.type!=="literal")values[part.type]=Number(part.value);
  });

  const representedAsUtc=Date.UTC(
    values.year,
    values.month-1,
    values.day,
    values.hour,
    values.minute,
    values.second
  );

  return representedAsUtc-date.getTime();
}

function saoPauloDateTimeMs(dateString,hour,minute){
  const [year,month,day]=dateString.split("-").map(Number);
  const desiredUtc=Date.UTC(year,month-1,day,hour,minute,0);
  let guess=desiredUtc;

  for(let i=0;i<2;i++){
    const offset=timeZoneOffsetMs(new Date(guess),"America/Sao_Paulo");
    guess=desiredUtc-offset;
  }

  return guess;
}

function eventStartMs(e){
  /*
    Textos como “base 2025 · a confirmar” não são horários oficiais.
    Eles não podem ativar o cronômetro.
  */
  if(isUnconfirmed(e))return null;

  const clocks=parseEventClockTimes(e.time);
  if(!clocks.length)return null;

  return saoPauloDateTimeMs(
    e.date,
    clocks[0].hour,
    clocks[0].minute
  );
}

function eventExplicitEndMs(e){
  if(isUnconfirmed(e))return null;

  const clocks=parseEventClockTimes(e.time);
  if(clocks.length<2)return null;

  const endDate=e.end||e.date;
  let value=saoPauloDateTimeMs(
    endDate,
    clocks[1].hour,
    clocks[1].minute
  );

  const start=eventStartMs(e);
  if(value<=start&&!e.end)value+=DAY_MS;
  return value;
}

function countdownEventIsPast(e){
  if(isPast(e))return true;

  const start=eventStartMs(e);
  const explicitEnd=eventExplicitEndMs(e);

  if(explicitEnd!==null&&Date.now()>explicitEnd)return true;

  /*
    Quando existe somente horário de início, consideramos uma duração
    padrão de 1 hora apenas para decidir qual é o próximo evento.
  */
  if(
    start!==null&&
    explicitEnd===null&&
    Date.now()>start+60*60*1000
  ){
    return true;
  }

  return false;
}

function compareCountdownEvents(a,b){
  const dateDifference=dateKey(a.date)-dateKey(b.date);
  if(dateDifference!==0)return dateDifference;

  const aStart=eventStartMs(a);
  const bStart=eventStartMs(b);

  /*
    No mesmo dia, um horário confirmado tem prioridade.
    Um texto sem horário ou “a confirmar” não disputa o cronômetro.
  */
  if(aStart!==null&&bStart===null)return -1;
  if(aStart===null&&bStart!==null)return 1;
  if(aStart!==null&&bStart!==null&&aStart!==bStart)return aStart-bStart;

  return String(a.id||id(a)).localeCompare(String(b.id||id(b)));
}

function futureEvents(list=S.data.events){
  return list
    .filter(e=>!countdownEventIsPast(e))
    .slice()
    .sort(compareCountdownEvents);
}

function nextEvent(list=S.data.events){
  return futureEvents(list)[0]||null;
}

function formatRemainingTime(milliseconds,compact=false){
  const totalSeconds=Math.max(0,Math.floor(milliseconds/1000));
  const hours=Math.floor(totalSeconds/3600);
  const minutes=Math.floor((totalSeconds%3600)/60);
  const seconds=totalSeconds%60;

  if(compact){
    return `${hours}h ${String(minutes).padStart(2,"0")}min`;
  }

  return [
    String(hours).padStart(2,"0"),
    String(minutes).padStart(2,"0"),
    String(seconds).padStart(2,"0")
  ].join(":");
}

function countdownText(e,compact=false){
  if(!e)return {number:"—",unit:"sem eventos",timer:false};

  const start=eventStartMs(e);

  if(start!==null){
    const remaining=start-Date.now();

    if(remaining>0&&remaining<=DAY_MS){
      return {
        number:formatRemainingTime(remaining,compact),
        unit:"para começar",
        timer:true
      };
    }

    if(remaining<=0){
      const explicitEnd=eventExplicitEndMs(e);

      if(
        (explicitEnd!==null&&Date.now()<=explicitEnd)||
        (explicitEnd===null&&Date.now()-start<=60*60*1000)
      ){
        return {
          number:"AGORA",
          unit:"em andamento",
          timer:false
        };
      }

      if(isCurrent(e)){
        return {
          number:"HOJE",
          unit:"evento iniciado",
          timer:false
        };
      }
    }
  }

  if(isCurrent(e)){
    return {
      number:"HOJE",
      unit:e.end&&e.end!==e.date?"em andamento":"é hoje",
      timer:false
    };
  }

  const n=Math.max(0,calendarDaysUntil(e.date));

  if(n===0)return {number:"HOJE",unit:"é hoje",timer:false};
  if(n===1)return {number:"1",unit:"dia faltando",timer:false};
  return {number:String(n),unit:"dias faltando",timer:false};
}

function parseCsv(text){
  const rows=[];let row=[],cell="",quoted=false;
  text=(text||"").replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(quoted){
      if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}
      else if(ch==='"'){quoted=false}
      else cell+=ch;
    }else{
      if(ch==='"')quoted=true;
      else if(ch===","){row.push(cell);cell=""}
      else if(ch==="\n"){row.push(cell);rows.push(row);row=[];cell=""}
      else if(ch!=="\r")cell+=ch;
    }
  }
  if(cell.length||row.length){row.push(cell);rows.push(row)}
  return rows;
}
function normalizeHeader(v){
  return (v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
}
function toIsoDate(value){
  const s=(value||"").trim();
  if(!s)return "";
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  return "";
}
function eventsFromCsv(text){
  const rows=parseCsv(text);
  if(rows.length<2)throw new Error("A planilha está vazia.");
  const headers=rows[0].map(normalizeHeader);
  const indexOf=(...names)=>{
    for(const name of names){
      const idx=headers.indexOf(normalizeHeader(name));
      if(idx>=0)return idx;
    }
    return -1;
  };
  const ix={
    date:indexOf("Data"),
    end:indexOf("Data final","Data fim"),
    disc:indexOf("Disciplina","Matéria","Materia"),
    label:indexOf("Evento","Atividade"),
    time:indexOf("Horário","Horario")
  };
  if(ix.date<0||ix.disc<0||ix.label<0){
    throw new Error("As colunas Data, Disciplina e Evento são obrigatórias.");
  }
  const result=[];
  for(const [rowIndex,row] of rows.slice(1).entries()){
    const date=toIsoDate(row[ix.date]);
    const code=(row[ix.disc]||"").trim().toUpperCase();
    const label=(row[ix.label]||"").trim();
    if(!date&&!code&&!label)continue;
    if(!date||!label||!S.data.disciplines[code])continue;
    const event={date,disc:code,label,_sourceKey:[code,date,label,row[ix.time]||"",rowIndex].join("|")};
    const finish=ix.end>=0?toIsoDate(row[ix.end]):"";
    if(finish&&dateKey(finish)>=dateKey(date))event.end=finish;
    const time=ix.time>=0?(row[ix.time]||"").trim():"";
    if(time)event.time=time;
    event.type=classify(event);
    result.push(event);
  }
  if(!result.length)throw new Error("Nenhum evento válido foi encontrado.");
  return prepareEvents(result);
}
function syncTimeLabel(date){
  if(!date)return "";
  return date.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function renderSyncStatus(){
  const box=$("#syncStatus");
  if(!box)return;
  box.className=`sync-status ${S.sync.status}`;
  const label=apiIsConnected()
    ? `<strong>Sincronização global ativa</strong> · ${S.sync.remoteCount} eventos · atualizado às ${syncTimeLabel(S.api.updatedAt)}`
    : S.sync.status==="ok"
      ? `<strong>Planilha conectada</strong> · ${S.sync.remoteCount} eventos · atualizado às ${syncTimeLabel(S.sync.updatedAt)}`
      : S.sync.status==="loading"
        ? `<strong>Atualizando planilha…</strong>`
        : `<strong>Usando cópia local</strong> · ${S.sync.message}`;
  box.innerHTML=`<div class="sync-left"><span class="sync-dot"></span><span class="sync-text">${label}</span></div>
    <button id="syncNow" class="sync-btn" ${S.sync.status==="loading"?"disabled":""}>Atualizar agora</button>`;
  const button=$("#syncNow");
  if(button)button.onclick=()=>refreshCurrentSource(false);
}
async function loadRemoteEvents(silent=false){
  const base=S.data?.meta?.sourceCsv;
  if(!base)return false;
  S.sync.status="loading";
  S.sync.message="Carregando planilha…";
  renderSyncStatus();
  try{
    const url=base+(base.includes("?")?"&":"?")+"_="+Date.now();
    const response=await fetch(url,{cache:"no-store",credentials:"omit"});
    if(!response.ok)throw new Error(`erro ${response.status}`);
    const text=await response.text();
    const remote=eventsFromCsv(text);
    S.data.events=remote;
    S.sync={status:"ok",message:"Planilha conectada",updatedAt:new Date(),remoteCount:remote.length};
    render();
    if(!silent)toast("Planilha atualizada");
    return true;
  }catch(error){
    S.sync.status="error";
    S.sync.message=navigator.onLine?"não foi possível acessar a planilha":"sem internet";
    renderSyncStatus();
    if(!silent)toast("Não foi possível atualizar. Mantive a cópia local.");
    return false;
  }
}

function renderCountdown(){
  // Contagem geral: sempre considera todas as disciplinas, independentemente dos filtros.
  const e=nextEvent(S.data.events.filter(x=>x.disc!=="GERAL"));
  const c=countdownText(e);
  const box=$("#countdown");
  if(!e){
    box.innerHTML="<div><div class='cd-title'>Sem eventos futuros 🎉</div></div>";
    return;
  }
  box.innerHTML=`
    <div><div class="cd-num ${c.timer?"timer":""}">${c.number}</div><div class="cd-unit">${c.unit}</div></div>
    <div>
      <div class="cd-title">${disc(e.disc).icon||""} ${disc(e.disc).name} — ${e.label}</div>
      <div class="cd-meta">${fmt(e.date)}${e.time?" · "+e.time:""}${e.end?" · até "+fmt(e.end):""}${eventStartMs(e)!==null?" · horário confirmado":""}</div>
    </div>`;
}

function legend(){
  return `<div class="legend">${Object.entries(S.data.disciplines).map(([k,v])=>
    `<button data-disc="${k}" class="${S.active.has(k)?"":"off"}">
      <span class="dot" style="background:${v.color}"></span>${v.short||v.name}
    </button>`).join("")}</div>`;
}

function row(e){
  const fav=S.favorites.has(id(e)),done=S.completed.has(id(e));
  return `<div class="trow">
    <div class="tdate">${fmt(e.date)}</div>

function rows(list){return list.length?`<div class="timeline">${list.map(row).join("")}</div>`:"<div class='empty'>Nenhum evento.</div>"}

function heavyWeeks(events){
  const map={};
  events.filter(e=>eventKind(e)==="assessment").forEach(e=>{
    const key0=dateKey(e.date);
    const day=(new Date(key0).getUTCDay()+6)%7;
    const key=new Date(key0-day*DAY_MS).toISOString().slice(0,10);
    (map[key]??=[]).push(e);
  });
  return Object.entries(map).sort((a,b)=>b[1].length-a[1].length).slice(0,5);
}

function statusSummary(events){
  const concluded=events.filter(isPast).length;
  return {concluded,pending:events.length-concluded,total:events.length};
}
function statusByType(events){
  return Object.keys(TYPE_META).map(type=>{
    const subset=events.filter(e=>eventKind(e)===type);
    return {type,...statusSummary(subset)};
  });
}
function statusByDiscipline(events){
  return Object.keys(S.data.disciplines)
    .filter(k=>k!=="GERAL")
    .map(k=>{
      const subset=events.filter(e=>e.disc===k);
      return {disc:k,...statusSummary(subset)};
    });
}
function statusBars(items,mode="type"){
  return `<div class="${mode==="disc"?"discipline-chart":"chart-list"}">${items.map(item=>{

    const pastPct=item.concluded/total*100;
    const futurePct=item.pending/total*100;
    return `<div class="chart-row">
      <div class="chart-name">${mode==="type"?meta.name:(meta.icon||"")+" "+meta.short}</div>
      <div class="stacked" title="${item.concluded} concluídas · ${item.pending} pendentes">

        <span class="seg-future" style="width:${futurePct}%"></span>

function dashboardMetricEvents(key){
  const events=S.data.events.filter(visible);

  if(key==="events")return events;
  if(key==="assessments")return events.filter(e=>eventKind(e)==="assessment");
  if(key==="gds")return events.filter(e=>eventKind(e)==="gd");
  if(key==="ambulatory")return events.filter(e=>eventKind(e)==="ambulatory");
  if(key==="pending")return events.filter(e=>!isPast(e));
  if(key==="concluded")return events.filter(isPast);

  return [];
}

function dashboardMetricTitle(key,count){
  const labels={
    events:count===1?"evento":"eventos",

    pending:count===1?"atividade pendente":"atividades pendentes",
    concluded:count===1?"atividade concluída":"atividades concluídas"
  };

  return `${count} ${labels[key]||"eventos"}`;
}

function calendar(){

    let cells="<div></div>".repeat(first.getUTCDay());
    for(let n=1;n<=count;n++){

}

function startOfWeek(){
  const p=saoPauloTodayParts();
  const today=Date.UTC(p.year,p.month-1,p.day);
  const day=(new Date(today).getUTCDay()+6)%7;
  return today-day*DAY_MS+S.weekOffset*7*DAY_MS;
}

function saveLocalEventEdit(){
  const event=selectedEventFromEditor();
  if(!event)return;
  const date=$("#eventEditDate").value;
  const end=$("#eventEditEnd").value;
  const label=$("#eventEditTitle").value.trim();
  const time=$("#eventEditTime").value.trim();

  if(!date||!label){
    toast("Preencha a data e o título.");
    return;
  }
  if(end&&dateKey(end)<dateKey(date)){
    toast("A data final não pode ser anterior à data inicial.");
    return;
  }

  const edits=loadEventEdits();
  edits[event._sourceKey]={date,end,label,time};
  saveEventEdits(edits);

  event.date=date;
  event.end=end||undefined;
  event.label=label;
  event.time=time||undefined;
  event.type=classify(event);

  render();
  S.view="settings";
  setView("settings");
  toast("Alteração salva neste aparelho.");
}

function resetSelectedLocalEventEdit(){
  const event=selectedEventFromEditor();
  if(!event)return;
  const edits=loadEventEdits();
  delete edits[event._sourceKey];
  saveEventEdits(edits);

  Object.assign(event,{
    date:event._source.date,
    end:event._source.end||undefined,
    label:event._source.label,
    time:event._source.time||undefined
  });
  event.type=classify(event);

  render();
  S.view="settings";
  setView("settings");
  toast("Evento restaurado.");
}

            <img id="appIconPreview" data-app-icon-preview src="${S.appIcon.url||DEFAULT_APP_ICON}" alt="Prévia do ícone">
          </div>
          <div class="app-icon-copy">
            <b>🖼️ Ícone do aplicativo</b>
            <div class="label">Escolha uma imagem. O site ajusta para 512 × 512 e sincroniza o ícone entre os aparelhos.</div>
            <label class="icon-file-label">
              <span>Escolher PNG, JPG, WEBP ou SVG</span>
              <input id="appIconFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
            </label>
            <div id="appIconFileName" class="sheet-note">${S.appIcon.custom?"Ícone personalizado ativo.":"Usando o icon.svg padrão do GitHub."}</div>
            <div class="actions">
              <button id="saveAppIconGlobal" class="sheet-btn primary" type="button">Salvar ícone para todos</button>
              <button id="resetAppIconGlobal" class="sheet-btn" type="button">Restaurar ícone padrão</button>
            </div>
          </div>
        </div>
        <div class="sheet-note">O favicon muda ao sincronizar. No iPhone/iPad, um atalho já instalado pode manter o ícone antigo; nesse caso, remova-o da Tela de Início e adicione novamente pelo Safari.</div>
      </div>

      <div class="setting setting-disciplines">
        <b>🎨 Cores e emojis das disciplinas — PERSONALIZAÇÃO ATIVA</b>
        <div class="label">Escolha uma cor e um emoji. A alteração é salva automaticamente para todos os aparelhos.</div>
        <div id="disciplineStyleEditor" class="discipline-style-editor"></div>
        <div class="actions">
          <button id="saveDiscStylesGlobal" class="sheet-btn primary" type="button">Salvar cores e emojis para todos</button>
          <button id="resetDiscStyles" class="sheet-btn" type="button">Restaurar cores e emojis padrão</button>
        </div>
        <div class="sheet-note">A sincronização é automática. O botão abaixo força o salvamento de todas as cores de uma vez.</div>
      </div>
      <div class="setting setting-chart-colors">
        <b>📊 Cores das barras e gráficos</b>
        <div class="label">Personalize as cores. Elas são salvas automaticamente para todos os aparelhos.</div>
        <div id="chartStyleEditor" class="chart-style-editor"></div>
        <div class="actions">
          <button id="saveChartStylesGlobal" class="sheet-btn primary" type="button">Salvar cores dos gráficos para todos</button>
          <button id="resetChartStyles" class="sheet-btn" type="button">Restaurar cores dos gráficos</button>
        </div>
      </div>

      <div class="setting setting-event-editor">
        <b>✏️ Editar datas e títulos no próprio site</b>
        <div class="label">Escolha um evento e altere data, título ou horário.</div>
        <div class="event-editor">
          <label>
            <span>Evento</span>
            <select id="eventEditorSelect" class="ctrl event-select"></select>
          </label>
          <div id="eventEditDiscipline" class="event-discipline"></div>
          <div class="event-edit-grid">
            <label><span>Data</span><input id="eventEditDate" type="date" class="ctrl"></label>
            <label><span>Data final</span><input id="eventEditEnd" type="date" class="ctrl"></label>
            <label class="event-title-field"><span>Título</span><input id="eventEditTitle" type="text" class="ctrl"></label>
            <label><span>Horário</span><input id="eventEditTime" type="text" class="ctrl" placeholder="Ex.: 14h–15h30"></label>
          </div>
          <div class="actions">
            <button id="saveEventGlobal" class="sheet-btn primary" type="button">Salvar para todos os dispositivos</button>
            <button id="saveEventEdit" class="sheet-btn" type="button">Salvar só neste aparelho</button>
            <button id="deleteEventGlobal" class="sheet-btn danger" type="button">Excluir para todos</button>
            <button id="resetEventEdit" class="sheet-btn" type="button">Restaurar este evento</button>
            <button id="resetAllEventEdits" class="sheet-btn" type="button">Apagar edições locais</button>
          </div>
        </div>
        <div class="sheet-note">“Salvar para todos” modifica a planilha central. “Salvar só neste aparelho” não altera os outros dispositivos.</div>
      </div>

      <div class="setting setting-add-event">
        <b>➕ Adicionar novo evento</b>
        <div class="label">O novo evento será gravado na planilha e aparecerá em todos os aparelhos.</div>
        <div class="event-edit-grid add-event-grid">
          <label><span>Data</span><input id="newEventDate" type="date" class="ctrl"></label>
          <label><span>Data final</span><input id="newEventEnd" type="date" class="ctrl"></label>
          <label>
            <span>Disciplina</span>
            <select id="newEventDisc" class="ctrl">
              ${Object.entries(S.data.disciplines).map(([code,item])=>`<option value="${code}">${item.icon||""} ${item.name}</option>`).join("")}
            </select>
          </label>
          <label class="event-title-field"><span>Título</span><input id="newEventTitle" type="text" class="ctrl" placeholder="Nome da atividade"></label>
          <label><span>Horário</span><input id="newEventTime" type="text" class="ctrl" placeholder="Ex.: 14h–15h30"></label>
        </div>
        <div class="actions">
          <button id="addEventGlobal" class="sheet-btn primary" type="button">Adicionar para todos os dispositivos</button>
        </div>
      </div>
      <div class="setting"><b>⏳ Contagem e cronômetro</b><div class="label">Usa sempre o horário de São Paulo. O cronômetro fica preso ao próximo evento confirmado e não usa horários marcados como “a confirmar” ou “base 2025”.</div></div>
      <div class="setting"><b>Google Planilhas</b><div class="label">O site usa somente a API central como fonte. O CSV publicado não interfere mais no próximo evento nem no cronômetro.</div></div>
      <div class="setting"><b>Funcionamento offline</b><div class="label">Sem internet, o site mantém a última cópia local disponível.</div></div>
      <div class="setting"><label><span><b>Limpar favoritos e marcações</b><div class="label">Remove apenas dados salvos neste navegador.</div></span><button id="reset" class="ctrl btn">Limpar</button></label></div>
    </div>
  </div>`;
  const editor=$("#disciplineStyleEditor");
  if(editor)editor.innerHTML=disciplineStyleEditor();
  const chartEditor=$("#chartStyleEditor");
  if(chartEditor)chartEditor.innerHTML=chartStyleEditor();
  renderLocalEventEditor();
}

function render(){
  renderCountdown();
  renderSyncStatus();
  dashboard();
  calendar();
  weekView();
  timeline();
  disciplines();
  resources();
  favorites();
  settings();
  bind();
  setView(S.view);
}

function bind(){
  $("#search").value=S.query;
  $("#type").value=S.type;
  $("#search").oninput=e=>{S.query=e.target.value.trim().toLowerCase();render()};
  $("#type").onchange=e=>{S.type=e.target.value;render()};
  $("#theme").onclick=toggleTheme;
  if($("#theme2"))$("#theme2").onclick=toggleTheme;
  if($("#syncNowSettings"))$("#syncNowSettings").onclick=()=>refreshCurrentSource(false);
  if($("#syncGlobalNow"))$("#syncGlobalNow").onclick=()=>bootstrapGlobal(false);
  if($("#appIconFile"))$("#appIconFile").onchange=previewSelectedAppIcon;
  if($("#saveAppIconGlobal"))$("#saveAppIconGlobal").onclick=uploadAppIconForEveryone;
  if($("#resetAppIconGlobal"))$("#resetAppIconGlobal").onclick=resetAppIconForEveryone;
  $$(".disc-color-input").forEach(input=>input.onchange=()=>{
    const code=input.dataset.code;
    const item=S.data.disciplines[code];
    if(!item)return;
    item.color=input.value;
    saveDisciplineStyle(code,item.color,item.icon||"");
    queueGlobalStyleItem({
      category:"disciplineColor",
      key:code,
      value:item.color
    });
    render();
    toast(`Salvando a cor de ${item.short||item.name}…`);
  });

  $$(".disc-emoji-input").forEach(input=>{
    input.onchange=()=>{
      const code=input.dataset.code;
      const item=S.data.disciplines[code];
      if(!item)return;
      const value=input.value.trim()||"📚";
      item.icon=value;
      saveDisciplineStyle(code,item.color,value);
      queueGlobalStyleItem({
        category:"disciplineIcon",
        key:code,
        value:value
      });
      render();
      toast(`Salvando o emoji de ${item.short||item.name}…`);
    };
    input.onkeydown=event=>{
      if(event.key==="Enter")input.blur();
    };
  });

  if($("#resetDiscStyles"))$("#resetDiscStyles").onclick=resetDisciplineStylesForEveryone;

  if($("#saveDiscStylesGlobal"))$("#saveDiscStylesGlobal").onclick=saveStylesForEveryone;
  if($("#saveChartStylesGlobal"))$("#saveChartStylesGlobal").onclick=saveStylesForEveryone;

  $$(".chart-color-input").forEach(input=>input.onchange=()=>{
    const key=input.dataset.chartColor;
    saveChartStyle(key,input.value);
    queueGlobalStyleItem({
      category:"chartColor",
      key:key,
      value:input.value
    });
    render();
    toast("Salvando a cor do gráfico…");
  });

  if($("#resetChartStyles"))$("#resetChartStyles").onclick=resetChartStylesForEveryone;

  if($("#eventEditorSelect"))$("#eventEditorSelect").onchange=()=>{
    fillEventEditor(selectedEventFromEditor());
  };
  if($("#saveEventGlobal"))$("#saveEventGlobal").onclick=saveEventForEveryone;
  if($("#deleteEventGlobal"))$("#deleteEventGlobal").onclick=deleteEventForEveryone;
  if($("#addEventGlobal"))$("#addEventGlobal").onclick=addEventForEveryone;
  if($("#saveEventEdit"))$("#saveEventEdit").onclick=saveLocalEventEdit;
  if($("#resetEventEdit"))$("#resetEventEdit").onclick=resetSelectedLocalEventEdit;
  if($("#resetAllEventEdits"))$("#resetAllEventEdits").onclick=()=>{
    if(confirm("Apagar todas as edições locais de datas e títulos?"))resetAllLocalEventEdits();
  };



  $$(".nav button").forEach(b=>b.onclick=()=>{S.view=b.dataset.view;setView(S.view)});
  $$("[data-disc]").forEach(b=>b.onclick=()=>{
    S.active.has(b.dataset.disc)?S.active.delete(b.dataset.disc):S.active.add(b.dataset.disc);
    render();
  });
  $$("[data-next-disc]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.nextDisc;
    S.active=new Set([k]);
    S.query="";
    S.type="all";
    S.view="timeline";
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  });
  $$("[data-fav]").forEach(b=>b.onclick=()=>{
    const x=decodeURIComponent(b.dataset.fav);
    S.favorites.has(x)?S.favorites.delete(x):S.favorites.add(x);
    save();render();toast("Favoritos atualizados");
  });
  $$("[data-done]").forEach(b=>b.onclick=()=>{
    const x=decodeURIComponent(b.dataset.done);
    S.completed.has(x)?S.completed.delete(x):S.completed.add(x);
    save();render();toast("Marcação atualizada");
  });
  $$("[data-dashboard-filter]").forEach(button=>{
    button.onclick=()=>openDashboardMetric(button.dataset.dashboardFilter);
  });
  $$("[data-day]").forEach(b=>b.onclick=()=>openDay(b.dataset.day));
  $$(".mobile-month-toggle").forEach(button=>button.onclick=()=>{
    const month=button.closest(".month");
    const opened=month.classList.toggle("mobile-open");
    button.textContent=opened?"Ocultar eventos do mês":"Ver eventos do mês";
  });

  $("#prevWeek").onclick=()=>{S.weekOffset--;weekView();bindWeek()};
  $("#nextWeek").onclick=()=>{S.weekOffset++;weekView();bindWeek()};
  $("#todayWeek").onclick=()=>{S.weekOffset=0;weekView();bindWeek()};

  $("#icsAll").onclick=()=>download("Calendario_Medicina_UFMG_6P_2026_2.ics",ics(S.data.events.filter(visible),"Medicina UFMG — 6º Período — 2026/2","#111827"));
  $("#icsDisc").onclick=()=>Object.entries(S.data.disciplines).forEach(([k,v],i)=>
    setTimeout(()=>download(v.name.replaceAll(" ","_")+".ics",ics(S.data.events.filter(e=>e.disc===k&&visible(e)),v.name,v.color)),i*350)
  );

  if($("#reset"))$("#reset").onclick=()=>{
    if(confirm("Limpar favoritos e eventos marcados manualmente como concluídos?")){
      S.favorites.clear();S.completed.clear();save();render();
    }
  };
  $(".close").onclick=closeDrawer;
  $(".backdrop").onclick=closeDrawer;
}
function bindWeek(){
  $$("[data-day]").forEach(b=>b.onclick=()=>openDay(b.dataset.day));
  $("#prevWeek").onclick=()=>{S.weekOffset--;weekView();bindWeek()};
  $("#nextWeek").onclick=()=>{S.weekOffset++;weekView();bindWeek()};
  $("#todayWeek").onclick=()=>{S.weekOffset=0;weekView();bindWeek()};
}
function openDay(iso){
  const es=S.data.events.filter(visible).filter(e=>days(e).includes(iso));
  $("#drawerTitle").textContent=`Eventos de ${fmt(iso)}`;
  $("#drawerBody").innerHTML=rows(es);
  $("#drawer").classList.add("show");
  bindDrawer();
}
function bindDrawer(){
  $(".close").onclick=closeDrawer;
  $(".backdrop").onclick=closeDrawer;
  $$("#drawer [data-fav]").forEach(b=>b.onclick=()=>{
    const x=decodeURIComponent(b.dataset.fav);
    S.favorites.has(x)?S.favorites.delete(x):S.favorites.add(x);
    save();render();closeDrawer();
  });
  $$("#drawer [data-done]").forEach(b=>b.onclick=()=>{
    const x=decodeURIComponent(b.dataset.done);
    S.completed.has(x)?S.completed.delete(x):S.completed.add(x);
    save();render();closeDrawer();
  });
}
function closeDrawer(){$("#drawer").classList.remove("show")}
function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light");
}

function esc(s){return(s||"").replaceAll("\\","\\\\").replaceAll("\n","\\n").replaceAll(",","\\,").replaceAll(";","\\;")}
function times(s){return[...((s||"").matchAll(/(\d{1,2})h(\d{2})?/g))].map(m=>[+m[1],+(m[2]||0)])}
function ics(list,name,color){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}Z/,"Z");
  let o=["BEGIN:VCALENDAR","VERSION:2.0","CALSCALE:GREGORIAN",`X-WR-CALNAME:${esc(name)}`,`X-APPLE-CALENDAR-COLOR:${color}`];
  list.forEach((e,i)=>{
    const ds=e.date.replaceAll("-",""),t=e.end?[]:times(e.time);
    o.push("BEGIN:VEVENT",`UID:${e.disc}-${ds}-${i}@turmaa`,`DTSTAMP:${stamp}`);
    if(t.length){
      const[sh,sm]=t[0],[eh,em]=t[1]||[Math.min(sh+1,23),sm];
      o.push(`DTSTART;TZID=America/Sao_Paulo:${ds}T${String(sh).padStart(2,"0")}${String(sm).padStart(2,"0")}00`,
             `DTEND;TZID=America/Sao_Paulo:${ds}T${String(eh).padStart(2,"0")}${String(em).padStart(2,"0")}00`);
    }else{
      const z=new Date((e.end||e.date)+"T00:00:00");z.setDate(z.getDate()+1);
      o.push(`DTSTART;VALUE=DATE:${ds}`,`DTEND;VALUE=DATE:${z.toISOString().slice(0,10).replaceAll("-","")}`);
    }
    o.push(`SUMMARY:${esc(e.label)}`,
           `DESCRIPTION:${esc(disc(e.disc).name+" — "+e.label+(e.time?" ("+e.time+")":"")+(e.how?"\n\nCOMO SERÁ: "+e.how:"")+(e.preparation?"\n\nCOMO SE PREPARAR: "+e.preparation:"")+(e.attention?"\n\nATENÇÃO: "+e.attention:""))}`,
           "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-P5D","DESCRIPTION:Faltam 5 dias","END:VALARM",
           "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-P2D","DESCRIPTION:Faltam 2 dias","END:VALARM",
           "END:VEVENT");
  });
  o.push("END:VCALENDAR");
  return o.join("\r\n");
}
function download(n,t){
  const b=new Blob([t],{type:"text/calendar;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);
}

document.addEventListener("DOMContentLoaded",async()=>{
  try{
    const response=await fetch("./eventos.json?v=26",{cache:"no-store"});
    const x=await response.json();
    S.data=x;
    S.defaultDisciplineStyles=Object.fromEntries(
      Object.entries(x.disciplines).map(([code,item])=>[
        code,
        {color:item.color,icon:item.icon||""}
      ])
    );
    applySavedDisciplineStyles();
    applyChartStyles();
    S.data.events=prepareEvents(S.data.events);
    Object.keys(x.disciplines).forEach(k=>S.active.add(k));
    document.body.innerHTML=shell()+`<div id="toast" class="toast"></div>`;
    if(localStorage.getItem("theme")==="dark")document.body.classList.add("dark");
    render();

    applyAppIcon({});

    /*
      O cronômetro usa somente a API como fonte.
      Enquanto a API responde, mostramos a última cópia da própria API,
      nunca o CSV publicado, para o evento não ficar alternando.
    */
    await bootstrapGlobal(true);

    setInterval(renderCountdown,1000);
    const refreshSeconds=30;
    setInterval(()=>{
      if(!pendingGlobalStyleItems.size)refreshCurrentSource(true);
    },refreshSeconds*1000);
    document.addEventListener("visibilitychange",()=>{
      if(document.visibilityState==="visible")refreshCurrentSource(true);
    });
    window.addEventListener("online",()=>refreshCurrentSource(true));

    
  }catch(error){
    document.body.innerHTML="<div class='boot'>Não foi possível carregar o calendário.</div>";
  }
});
</script>
